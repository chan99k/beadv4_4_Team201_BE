spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/giftify_db}
    username: ${DB_USERNAME:giftify}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO g7settlement, public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: g7settlement

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    schemas: g7settlement
    default-schema: g7settlement
    create-schemas: true
    out-of-order: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/
          jwk-set-uri: https://${AUTH0_DOMAIN}/.well-known/jwks.json

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    consumer:
      group-id: settlement-server
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never

auth0:
  audience: ${AUTH0_AUDIENCE}

app:
  service:
    api-server:
      url: ${API_SERVER_URL:http://localhost:8080}

management:
  metrics:
    tags:
      application: ${spring.application.name:giftify-settlement}
      env: dev
